name: Déployer le site

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 * * * *"      # toutes les heures : rafraîchit le planning du Jacob's Contest et les prix PNJ
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Porte de qualité : rien n'est publié si un test échoue (un déploiement cassé ne remplace pas le site en ligne).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Tests
        run: node --test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Assembler le site
        run: |
          mkdir _site
          cp -r index.html brand.html logo.svg fonts _site/
          node scripts/fetch-contests.mjs > _site/contests.json
          node scripts/fetch-npc.mjs > _site/npc.json
          head -c 200 _site/contests.json; echo
          head -c 200 _site/npc.json; echo
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
