name: Déployer le site

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 * * * *"      # toutes les heures : rafraîchit le planning du Jacob's Contest
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assembler le site
        run: |
          mkdir _site
          cp index.html _site/
          node scripts/fetch-contests.mjs > _site/contests.json
          head -c 300 _site/contests.json; echo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
